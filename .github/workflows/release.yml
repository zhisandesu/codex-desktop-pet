name: Build draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check tag matches version
        shell: pwsh
        run: |
          $versionValue = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$versionValue") { throw 'Tag and version.json differ' }
      - run: python tools/release.py scan
      - run: dotnet restore XiaobianPet/XiaobianPet.csproj --locked-mode
      - run: python tools/release.py test
      - run: python tools/release.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            release-output/**/*.zip
            release-output/**/SHA256SUMS.txt
            release-output/**/release-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Create draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionValue = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $releaseAssets = Get-ChildItem "release-output/$versionValue" -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -in 'SHA256SUMS.txt','release-audit.json' } | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @releaseAssets --draft --title "Keduo $versionValue" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
